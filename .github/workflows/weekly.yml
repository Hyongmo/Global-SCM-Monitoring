name: KMI 주간 공급망 모니터링 초안 생성

on:
  # daily.yml 완료 후 월요일에만 실행
  workflow_run:
    workflows: ["KMI 해상공급망 일일 모니터링"]
    types: [completed]

  # 수동 실행
  workflow_dispatch:
    inputs:
      week_tag:
        description: '배포일 기준 = 월요일 (YYYYMMDD, 기본: 오늘)'
        required: false
        default: ''

jobs:
  weekly-pipeline:
    runs-on: ubuntu-latest
    # workflow_dispatch는 항상 실행, workflow_run은 daily.yml이 성공했을 때만 실행
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 180      # 최대 3시간 (LLM 분류 포함)
    permissions:
      contents: write           # git push 허용

    steps:
      # ────────────────────────────────────────────────────────
      # 1. 월요일 여부 확인 (workflow_dispatch는 요일 무관 실행)
      # ────────────────────────────────────────────────────────
      - name: Check if Monday
        id: check_day
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "수동 실행 — 요일 무관 실행"
          else
            DOW=$(TZ=Asia/Seoul date '+%u')   # 1=월요일
            if [ "$DOW" = "1" ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "오늘은 월요일 (KST) — 실행"
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "오늘은 월요일이 아님 (요일=$DOW) — 건너뜀"
            fi
          fi

      # ────────────────────────────────────────────────────────
      # 2. 코드 체크아웃
      # ────────────────────────────────────────────────────────
      - name: Checkout repository
        if: steps.check_day.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ────────────────────────────────────────────────────────
      # 3. Python 환경 설정
      # ────────────────────────────────────────────────────────
      - name: Set up Python
        if: steps.check_day.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check_day.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      # ────────────────────────────────────────────────────────
      # 4. 주간 태그 결정 (수동 실행 시 입력값, 자동 실행 시 오늘 날짜)
      # ────────────────────────────────────────────────────────
      # 태그 계약이 소비처마다 다르므로 두 개로 분리한다.
      #   PUB_TAG  = 배포 기준일(월요일) — 이메일 발송, 커밋 메시지, PDF 표시일
      #   DATA_TAG = 데이터 기준일(일요일) — 주간 기사 CSV, phaseA 점수
      # weekly_pipeline.py 는 week_tag=일요일 을 계약으로 삼고
      # 내부에서 ref_date(월요일) = week_tag + 1일 로 파생시킨다.
      # (weekly_pipeline.py 2563~2564행 참조)
      - name: Determine week tags
        if: steps.check_day.outputs.should_run == 'true'
        run: |
          if [ -n "${{ github.event.inputs.week_tag }}" ]; then
            PUB_TAG="${{ github.event.inputs.week_tag }}"
          else
            PUB_TAG=$(TZ=Asia/Seoul date '+%Y%m%d')
          fi
          DATA_TAG=$(TZ=Asia/Seoul date -d "${PUB_TAG:0:4}-${PUB_TAG:4:2}-${PUB_TAG:6:2} -1 day" '+%Y%m%d')

          echo "PUB_TAG=$PUB_TAG"   >> $GITHUB_ENV
          echo "DATA_TAG=$DATA_TAG" >> $GITHUB_ENV
          echo "배포 태그(월요일): $PUB_TAG"
          echo "데이터 태그(일요일): $DATA_TAG"

          # 조기 실패 — STEP 1을 다 돌고 STEP 2에서 죽는 것을 방지
          f="monitoring/weekly/gdelt_mon_classified_week_${DATA_TAG}.csv"
          if [ ! -f "$f" ]; then
            echo "::error::주간 기사 파일이 없습니다: $f"
            echo "  daily.yml 이 해당 주의 주간 롤링 파일을 생성/커밋했는지 확인하세요."
            exit 1
          fi
          echo "주간 기사 파일 확인: $f"

      # ────────────────────────────────────────────────────────
      # 5. 주간 파이프라인 실행
      #    수집 → 분류 → 시나리오 생성 등 (내부에서 순차 호출)
      # ────────────────────────────────────────────────────────
      - name: Run weekly pipeline
        if: steps.check_day.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KMI_SMTP_ADDRESS:   ${{ secrets.KMI_SMTP_ADDRESS }}
          KMI_SMTP_PASSWORD:  ${{ secrets.KMI_SMTP_PASSWORD }}
        run: |
          python scripts/weekly_pipeline.py ${{ env.DATA_TAG }}

      # ────────────────────────────────────────────────────────
      # 6. 데이터 파일 커밋 & 푸시
      #    다음 주 파이프라인의 입력이 되는 누적 데이터를 리포지토리에 반영
      #    (indicator, cluster, phaseA 분류, scenario JSON, HTML 초안)
      # ────────────────────────────────────────────────────────
      - name: Commit and push pipeline data
        if: steps.check_day.outputs.should_run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 누적 데이터 파일 스테이징
          # ⚠ docs/weekly_report.html 은 여기서 커밋하지 않는다.
          #    docs/ 는 GitHub Pages 공개 경로(CNAME 존재)이므로, 초안을 커밋하면
          #    감수 전 원고가 그대로 대외 공개된다.
          #    초안 검토는 Step 7의 검토 메일 첨부로만 이루어지고,
          #    공개 게시는 감수 완료 후 weekly_finalize.yml 이 담당한다.
          #    (러너 작업공간에는 HTML이 그대로 남아 있으므로 메일 발송에는 영향 없음)
          git add indicator_weekly.csv indicator_weekly_dates.csv \
                  cluster_registry_v2.json scenario_results.json \
                  news_scored_phaseA_v7_*.csv \
                  2>/dev/null || true

          echo "=== staged files ==="
          git diff --cached --name-only || true

          # 변경 없으면 커밋 건너뜀
          git diff --cached --quiet && echo "변경 없음 — 커밋 건너뜀" && exit 0

          git commit -m "weekly: ${{ env.PUB_TAG }} 초안 데이터 커밋 [skip ci]"
          git push origin HEAD

      # ────────────────────────────────────────────────────────
      # 7. 검토용 이메일 발송 (담당자 검토 후 weekly_finalize.yml로 최종 게시)
      # ────────────────────────────────────────────────────────
      - name: Send review email
        if: steps.check_day.outputs.should_run == 'true'
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KMI_SMTP_ADDRESS:   ${{ secrets.KMI_SMTP_ADDRESS }}
          KMI_SMTP_PASSWORD:  ${{ secrets.KMI_SMTP_PASSWORD }}
        run: |
          python scripts/send_weekly_email.py --review --week-tag ${{ env.PUB_TAG }}

      # ────────────────────────────────────────────────────────
      # 8. 실행 요약
      # ────────────────────────────────────────────────────────
      - name: Pipeline summary
        if: always() && steps.check_day.outputs.should_run == 'true'
        run: |
          echo "## 주간 파이프라인 실행 결과" >> $GITHUB_STEP_SUMMARY
          echo "- 트리거: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 배포 태그(월요일): ${{ env.PUB_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- 데이터 태그(일요일): ${{ env.DATA_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- 데이터 커밋: ✅ (indicator, cluster, phaseA, scenario) — HTML 초안은 미게시" >> $GITHUB_STEP_SUMMARY
          echo "- 초안 HTML: 📧 검토 메일 첨부로만 전달 (docs/ 미커밋)" >> $GITHUB_STEP_SUMMARY
          echo "- 최종 게시: weekly_finalize.yml에서 수동 실행" >> $GITHUB_STEP_SUMMARY
