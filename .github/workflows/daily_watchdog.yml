name: KMI 일일 모니터링 미실행 감시

# daily.yml 의 스케줄 트리거가 누락되는 경우를 감지해 자동 복구한다.
# (2026-08-28 사고: KST 04:00 예정 실행이 아예 발생하지 않음.
#  GitHub Actions 는 스케줄 실행을 지연시키거나 건너뛸 수 있음 — 문서화된 동작)
#
# ⚠ 중복 실행 방지가 핵심이다. 단순히 "결과가 없다"로 재실행하면
#    단지 지연된 실행과 겹쳐 같은 날짜를 두 번 처리하게 된다.

on:
  # KST 08:00 (= 23:00 UTC). daily 는 KST 04:17 시작·약 1시간 소요이므로 충분한 여유.
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write        # daily.yml 재실행(dispatch) 용

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 일일 실행 누락 여부 확인 및 복구
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_DATE=$(TZ=Asia/Seoul date -d 'yesterday' '+%Y-%m-%d')
          TARGET_TAG=$(TZ=Asia/Seoul date -d 'yesterday' '+%Y%m%d')
          RESULT="monitoring/${TARGET_TAG}/daily_report_llm_${TARGET_TAG}.json"
          echo "점검 대상: ${TARGET_DATE} (${RESULT})"

          # ── ① 결과가 이미 저장소에 있으면 정상 ──
          if [ -f "$RESULT" ]; then
            echo "✅ 정상 — 결과 파일 존재. 조치 없음."
            exit 0
          fi

          # ── ② 진행 중/대기 중 실행이 있으면 '지연'으로 보고 손대지 않는다 ──
          ACTIVE=$(gh run list --workflow=daily.yml --limit 30 \
                     --json status \
                     --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length')
          if [ "${ACTIVE:-0}" -gt 0 ]; then
            echo "⏳ daily.yml 실행 중(${ACTIVE}건) — 지연으로 판단, 재실행하지 않음."
            exit 0
          fi

          # ── ③ 최근 12시간 내 실행 이력이 있으면 이미 시도한 것 ──
          #     실패했더라도 자동 재시도하지 않는다 (2시간짜리 반복 소모 방지)
          SINCE=$(date -u -d '12 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          RECENT=$(gh run list --workflow=daily.yml --limit 30 \
                     --json createdAt,conclusion \
                     --jq --arg t "$SINCE" '[.[] | select(.createdAt > $t)] | length')
          if [ "${RECENT:-0}" -gt 0 ]; then
            MSG="daily.yml 실행 이력은 있으나(최근 12시간 ${RECENT}건) ${TARGET_TAG} 결과가 저장소에 없습니다. 실행이 실패했을 수 있어 자동 재실행하지 않습니다 — 로그 확인이 필요합니다."
            echo "⚠ ${MSG}"
            echo "::warning title=일일 파이프라인 결과 없음::${MSG}"
            exit 0
          fi

          # ── ④ 실행 이력 자체가 없음 = 스케줄 트리거 누락 → 자동 복구 ──
          MSG="${TARGET_DATE} 일일 파이프라인이 실행되지 않았습니다(스케줄 트리거 누락 추정). daily.yml 을 자동 재실행합니다."
          echo "⚠ ${MSG}"
          echo "::warning title=일일 실행 누락 — 자동 복구::${MSG}"
          gh workflow run daily.yml -f target_date="${TARGET_DATE}"
          echo "✅ daily.yml dispatch 완료 (target_date=${TARGET_DATE})"
