name: KMI 해상공급망 일일 모니터링

on:
  # ── 매일 04:17 KST (= 19:17 UTC 전날) ──
  #    정각(:00)은 전 세계 요청이 몰려 스케줄 지연·누락 확률이 가장 높다.
  #    (2026-08-28 트리거 누락 사고 이후 정각을 피해 이동)
  schedule:
    - cron: '17 19 * * *'

  # ── 수동 실행 (날짜 지정 가능) ──
  workflow_dispatch:
    inputs:
      target_date:
        description: '수집 날짜 (YYYY-MM-DD, 기본: 어제)'
        required: false
        default: ''
      test_scale:
        description: '테스트 모드 샘플 수 (0=정상, 50=각50건 축소 테스트)'
        required: false
        default: '0'
      skip_collect:
        description: '수집 건너뛰기 (1=기존 raw CSV로 분류+리포트만 재실행)'
        required: false
        default: '0'

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # GitHub 잡 최대치(6시간) = 최후 안전망일 뿐, 평소 쓰이지 않는다.
                              # 2026-08-29 재설계: 뒷단계 몫을 빼서 GDELT 를 깎던 방식을 폐기.
                              #   GDELT 에 GDELT_BUDGET_MIN(150분)을 고정 배정하고,
                              #   네이버·LLM 분류·리포트 생성은 남은 시간을 제한 없이 사용한다.
                              #   → 어떤 상황에서도 리포트는 반드시 생성된다.
                              #   실측 뒷단계 소요 13분 10초 (run #171, GDELT 0초인 실행).
    permissions:
      contents: write         # git push 허용

    steps:
      # ────────────────────────────────────────────────────────
      # 1. 코드 체크아웃 (classified CSV 포함)
      # ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 전체 히스토리 (weekly 재구성용)

      # ────────────────────────────────────────────────────────
      # 2. Python 환경 설정
      # ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ────────────────────────────────────────────────────────
      # 3. 날짜 결정 (수동 실행 시 입력값, 자동 실행 시 어제)
      # ────────────────────────────────────────────────────────
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "TARGET_DATE=${{ github.event.inputs.target_date }}" >> $GITHUB_ENV
          else
            # UTC 21:10 = KST 다음날 06:10 → '어제' = 전날 KST
            echo "TARGET_DATE=$(TZ=Asia/Seoul date -d 'yesterday' '+%Y-%m-%d')" >> $GITHUB_ENV
          fi
          echo "날짜: $TARGET_DATE"

      # ────────────────────────────────────────────────────────
      # 4. 일일 파이프라인 실행
      #    collect_daily.py → build_viewer.py 내부 호출 포함
      # ────────────────────────────────────────────────────────
      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
          PYTHONUNBUFFERED:     "1"   # 강제 종료 시에도 로그가 남도록(2026-08-26 사고)
          GDELT_BUDGET_MIN:     "150"   # GDELT 단계 총 예산(분). 뒷단계는 별도 예약 없음
          TEST_SCALE:           ${{ github.event.inputs.test_scale || '0' }}
          SKIP_COLLECT:         ${{ github.event.inputs.skip_collect || '0' }}
        run: |
          python scripts/collect_daily.py ${{ env.TARGET_DATE }}

      # ────────────────────────────────────────────────────────
      # 6. Classified CSV + JSON + HTML 커밋 & 푸시
      #    (weekly 재구성에 필요한 분류 CSV 보존)
      # ────────────────────────────────────────────────────────
      - name: Commit classified CSVs and reports
        if: always()
        run: |
          DATE_TAG=$(echo "${{ env.TARGET_DATE }}" | tr -d '-')
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 저장 대상:
          #   - classified CSV  (저작권 문제 없는 분류 결과, weekly 재구성용)
          #   - JSON report     (build_viewer.py 가 30일치 읽어서 HTML 생성)
          #   - HTML viewer     (GitHub Pages 게시용)
          echo "=== 파일 존재 확인 ==="
          ls monitoring/${DATE_TAG}/ 2>/dev/null || echo "⚠ monitoring/${DATE_TAG}/ 없음"
          echo "=== git status ==="
          git status --short monitoring/${DATE_TAG}/ || true

          # 파일별 개별 add (일부 파일 미생성 시에도 나머지 커밋되도록)
          for f in \
            "monitoring/${DATE_TAG}/gdelt_mon_classified_daily_${DATE_TAG}.csv" \
            "monitoring/${DATE_TAG}/naver_mon_classified_daily_${DATE_TAG}.csv" \
            "monitoring/${DATE_TAG}/gdelt_mon_daily_${DATE_TAG}.csv" \
            "monitoring/${DATE_TAG}/naver_mon_daily_${DATE_TAG}.csv" \
            "monitoring/${DATE_TAG}/daily_report_llm_${DATE_TAG}.json" \
            "monitoring/${DATE_TAG}/daily_report_llm_${DATE_TAG}.md" \
            "monitoring/${DATE_TAG}/daily_report_llm_${DATE_TAG}.docx" \
            "monitoring/${DATE_TAG}/daily_report_${DATE_TAG}.xlsx" \
            docs/index.html; do
            [ -f "$f" ] && git add "$f"
          done
          git add monitoring/weekly/ 2>/dev/null || true

          echo "=== staged files ==="
          git diff --cached --name-only || true

          # 변경 없으면 커밋 건너뜀
          git diff --cached --quiet && echo "변경 없음 — 커밋 건너뜀" && exit 0

          git commit -m "daily: ${DATE_TAG} 모니터링 결과 [skip ci]"
          git push origin HEAD

      # ────────────────────────────────────────────────────────
      # 7. 이메일 발송 (xlsx + docx + md 첨부)
      # ────────────────────────────────────────────────────────
      - name: Send email report
        if: success()
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KMI_SMTP_ADDRESS:   ${{ secrets.KMI_SMTP_ADDRESS }}
          KMI_SMTP_PASSWORD:  ${{ secrets.KMI_SMTP_PASSWORD }}
        run: |
          python scripts/send_email.py ${{ env.TARGET_DATE }}
        continue-on-error: true

      - name: Send summary email (external recipients)
        if: success()
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KMI_SMTP_ADDRESS:   ${{ secrets.KMI_SMTP_ADDRESS }}
          KMI_SMTP_PASSWORD:  ${{ secrets.KMI_SMTP_PASSWORD }}
        run: |
          python scripts/send_email.py ${{ env.TARGET_DATE }} --summary --to lde@kmi.re.kr rheesw@kmi.re.kr pr@kmi.re.kr
        continue-on-error: true

      # ────────────────────────────────────────────────────────
      # 8. 실패 시 요약 출력
      # ────────────────────────────────────────────────────────
      - name: Pipeline summary
        if: always()
        run: |
          echo "## 파이프라인 실행 결과" >> $GITHUB_STEP_SUMMARY
          echo "- 날짜: ${{ env.TARGET_DATE }}" >> $GITHUB_STEP_SUMMARY
          DATE_TAG=$(echo "${{ env.TARGET_DATE }}" | tr -d '-')
          if [ -f "monitoring/${DATE_TAG}/daily_report_llm_${DATE_TAG}.json" ]; then
            ALERT=$(python -c "
          import json
          with open('monitoring/${DATE_TAG}/daily_report_llm_${DATE_TAG}.json') as f:
              d = json.load(f)
          print(d.get('llm_result', {}).get('alert_level', 'N/A'))
            " 2>/dev/null || echo "N/A")
            echo "- 경보 수준: ${ALERT}" >> $GITHUB_STEP_SUMMARY
            echo "- JSON 리포트: ✅ 생성됨" >> $GITHUB_STEP_SUMMARY
          else
            echo "- JSON 리포트: ❌ 없음" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "docs/index.html" ]; then
            echo "- HTML 뷰어: ✅ [열기](https://${GITHUB_REPOSITORY_OWNER}.github.io/$(echo ${GITHUB_REPOSITORY} | cut -d/ -f2)/)" >> $GITHUB_STEP_SUMMARY
          fi
